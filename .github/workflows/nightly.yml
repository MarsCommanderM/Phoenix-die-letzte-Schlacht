name: Phoenix Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Nightly validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/check_architecture.py
      - run: python tools/validation/validate_project.py
      - run: python tools/validation/validate_assets.py
      - run: python tools/validation/validate_versions.py
      - run: python tools/profiling/analyze_budget.py
      - run: python scripts/test.py
      - run: python scripts/check_cmake.py
