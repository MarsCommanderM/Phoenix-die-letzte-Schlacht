name: Phoenix Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/test.py
      - run: python scripts/check_cmake.py
      - name: Generate source manifest
        run: python scripts/generate_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-source-manifest
          path: build/source_manifest.json
